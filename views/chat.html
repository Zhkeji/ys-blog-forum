<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>私信聊天 - YS论坛</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f7fa;--card:#fff;--primary:#6366f1;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--hover:#f8fafc}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--primary:#818cf8;--text:#f1f5f9;--text-light:#94a3b8;--border:#334155;--hover:#1e293b}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
.chat-container{display:flex;flex:1;overflow:hidden}
.conv-list{width:300px;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column}
.conv-header{padding:16px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between}
.conv-header a{font-size:13px;color:var(--primary);text-decoration:none}
.conv-items{flex:1;overflow-y:auto}
.conv-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:0.15s}
.conv-item:hover{background:var(--hover)}
.conv-item.active{background:var(--hover);border-left:3px solid var(--primary)}
.conv-item img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.conv-info{flex:1;min-width:0}
.conv-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-msg{font-size:12px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:11px;color:var(--text-light);text-align:right}
.unread-dot{width:8px;height:8px;background:var(--primary);border-radius:50%}
.chat-area{flex:1;display:flex;flex-direction:column}
.chat-header{padding:16px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:10px}
.chat-header img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.chat-header .name{font-weight:600;font-size:15px}
.chat-header .status{font-size:12px;color:var(--text-light)}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;max-width:70%}
.msg.sent{align-self:flex-end;flex-direction:row-reverse}
.msg img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word}
.msg.sent .msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.received .msg-bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:11px;color:var(--text-light);margin-top:4px}
.msg.sent .msg-time{text-align:right}
.msg.system{text-align:center;align-self:center}
.msg.system .msg-bubble{background:var(--hover);color:var(--text-light);font-size:12px;padding:4px 12px;border-radius:12px}
.chat-input{padding:12px 16px;border-top:1px solid var(--border);background:var(--card);display:flex;gap:8px}
.chat-input input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:20px;font-size:14px;outline:none;background:var(--bg);color:var(--text)}
.chat-input input:focus{border-color:var(--primary)}
.chat-input button{width:40px;height:40px;background:var(--primary);color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:16px}
.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:14px}
@media(max-width:768px){.conv-list{width:100%;position:absolute;inset:0;z-index:10;background:var(--card)}.conv-list.hidden{display:none}.chat-area{width:100%}}
</style>
</head>
<body>
<div class="chat-container">
  <div class="conv-list" id="convList">
    <div class="conv-header"><span>💬 私信</span><a href="/">返回首页</a></div>
    <div class="conv-items" id="convItems"><p style="padding:20px;text-align:center;color:var(--text-light)">加载中...</p></div>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="empty-chat" id="emptyChat"><div style="text-align:center"><div style="font-size:48px;margin-bottom:12px">💬</div><p>选择一个会话开始聊天</p></div></div>
    <div class="chat-header" id="chatHeader" style="display:none"><img id="chatAvatar"><div><div class="name" id="chatName">-</div><div class="status" id="chatStatus">离线</div></div></div>
    <div class="chat-messages" id="chatMessages" style="display:none"></div>
    <div class="chat-input" id="chatInput" style="display:none"><input id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button></div>
  </div>
</div>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>
var TOKEN=localStorage.getItem('token')||null,USER=null,socket=null,conversations=[],currentConv=null;
if(!TOKEN)location.href='/';
function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function timeAgo(s){if(!s)return'';var d=new Date(s+(s.indexOf('Z')>=0?'':'Z')),diff=Math.floor((Date.now()-d)/1000);if(diff<60)return'刚刚';if(diff<3600)return Math.floor(diff/60)+'分钟前';if(diff<86400)return Math.floor(diff/3600)+'小时前';return Math.floor(diff/86400)+'天前';}
function api(m,u,d,cb){var h={'Content-Type':'application/json'};if(TOKEN)h['Authorization']='Bearer '+TOKEN;var r=new XMLHttpRequest();r.open(m,u,true);for(var k in h)r.setRequestHeader(k,h[k]);r.onreadystatechange=function(){if(r.readyState===4)try{var j=JSON.parse(r.responseText);cb(null,j);}catch(e){cb('解析失败');}};r.onerror=function(){cb('网络错误');};r.send(d?JSON.stringify(d):null);}

fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+TOKEN}}).then(function(r){return r.json();}).then(function(d){if(d.code===200){USER=d.data.user;initSocket();loadConvs();var p=new URLSearchParams(location.search);if(p.get('id'))setTimeout(function(){openConv(p.get('id'));},500);}else{localStorage.removeItem('token');location.href='/';}}).catch(function(){localStorage.removeItem('token');location.href='/';});

function initSocket(){socket=io({auth:{token:TOKEN},transports:['polling','websocket']});socket.on('new_message',function(m){if(currentConv&&m.conversation_id===currentConv.id){appendMsg(m);socket.emit('mark_read',{conversationId:currentConv.id});scrollBottom();}loadConvs();});socket.on('user_online',function(d){if(currentConv&&currentConv.other_id===d.userId){document.getElementById('chatStatus').textContent='在线';document.getElementById('chatStatus').style.color='#10b981';}});socket.on('user_offline',function(d){if(currentConv&&currentConv.other_id===d.userId){document.getElementById('chatStatus').textContent='离线';document.getElementById('chatStatus').style.color='var(--text-light)';}});socket.on('user_typing',function(d){if(currentConv&&currentConv.other_id===d.userId){document.getElementById('chatStatus').textContent='输入中...';setTimeout(function(){document.getElementById('chatStatus').textContent='在线';},2000);}});}

function loadConvs(){api('GET','/api/chat/conversations',null,function(err,d){if(err||d.code!==200)return;conversations=d.data.conversations;var list=document.getElementById('convItems');if(!conversations.length){list.innerHTML='<p style="padding:20px;text-align:center;color:var(--text-light)">暂无私信</p>';return;}list.innerHTML=conversations.map(function(c){return '<div class="conv-item'+(currentConv&&currentConv.id===c.id?' active':'')+'" onclick="openConv(\''+c.id+'\')"><img src="'+(c.other_avatar||'/img/default-avatar.png')+'"><div class="conv-info"><div class="conv-name">'+esc(c.other_name||'用户')+'</div><div class="conv-msg">'+esc(c.last_message||'暂无消息')+'</div></div><div style="text-align:right"><div class="conv-time">'+(c.last_message_at?timeAgo(c.last_message_at):'')+'</div>'+(c.unread_count?'<div class="unread-dot" style="margin-left:auto;margin-top:4px"></div>':'')+'</div></div>';}).join('');});}

function openConv(id){var conv=conversations.find(function(c){return c.id===id;});if(!conv){api('POST','/api/chat/conversations',{userId:id},function(err,d){if(err||d.code!==200)return;conv=d.data.conversation;conversations.push(conv);doOpenConv(conv);});return;}doOpenConv(conv);}

function doOpenConv(conv){currentConv=conv;document.getElementById('convList').classList.add('hidden');document.getElementById('emptyChat').style.display='none';document.getElementById('chatHeader').style.display='flex';document.getElementById('chatMessages').style.display='flex';document.getElementById('chatInput').style.display='flex';document.getElementById('chatAvatar').src=conv.other_avatar||'/img/default-avatar.png';document.getElementById('chatName').textContent=conv.other_name||'用户';document.getElementById('chatStatus').textContent='离线';loadMsgs();if(socket&&socket.connected)socket.emit('mark_read',{conversationId:conv.id});loadConvs();}

function loadMsgs(){api('GET','/api/chat/conversations/'+currentConv.id+'/messages',null,function(err,d){if(err||d.code!==200)return;var area=document.getElementById('chatMessages');area.innerHTML='';d.data.messages.forEach(function(m){appendMsg(m);});scrollBottom();});}

function appendMsg(m){var area=document.getElementById('chatMessages');var div=document.createElement('div');if(m.type==='system'){div.className='msg system';div.innerHTML='<div class="msg-bubble">'+esc(m.content)+'</div>';}else{var isSent=m.sender_id===USER.id;div.className='msg '+(isSent?'sent':'received');div.innerHTML='<img src="'+(m.sender_avatar||'/img/default-avatar.png')+'"><div><div class="msg-bubble">'+(m.type==='image'?'<img src="'+m.content+'" style="max-width:200px;border-radius:8px">':esc(m.content))+'</div><div class="msg-time">'+timeAgo(m.created_at)+'</div></div>';}area.appendChild(div);}

function scrollBottom(){var area=document.getElementById('chatMessages');area.scrollTop=area.scrollHeight;}

function sendMessage(){var input=document.getElementById('msgInput');var content=input.value.trim();if(!content||!currentConv)return;if(socket&&socket.connected){socket.emit('send_message',{conversationId:currentConv.id,content:content,type:'text'});}else{api('POST','/api/chat/conversations/'+currentConv.id+'/messages',{content:content},function(err,d){if(err||d.code!==200)return;appendMsg(d.data.message);scrollBottom();});}input.value='';}

document.getElementById('msgInput').addEventListener('input',function(){if(socket&&currentConv)socket.emit('typing',{conversationId:currentConv.id});});
</script>
</body>
</html>
